<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>بيعتي | نظام المبيعات</title>
<style>
:root{--bg:#0b1020;--card:#111827;--card2:#182235;--text:#f8fafc;--muted:#94a3b8;--line:#263244;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:12px}.top{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:23px;font-weight:900}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:650px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}input,select{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;outline:0}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 5px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.primary{background:var(--ok);color:#052e16}.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.danger{background:#351318;color:#fecaca}.warn{background:#3b2a08;color:#fde68a}.actions{display:flex;gap:7px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:58px;z-index:4;background:#0b1020f5}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 12px;border-radius:999px}.tabs .active{background:#12341e;color:#86efac;border-color:#166534}.stat{background:#0b1220;border:1px solid var(--line);border-radius:15px;padding:13px}.stat span{color:var(--muted);font-size:12px}.big{font-size:25px;font-weight:900;margin-top:4px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0}.name{font-weight:850}.price{color:#86efac;font-weight:850}.small{font-size:11px;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#172033}.on{background:#12351f;color:#86efac}.empty{text-align:center;color:var(--muted);padding:25px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(470px,100%)}.logo{text-align:center;font-size:48px}.center{text-align:center}.hide{display:none!important}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal>div{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#fff;color:#111;padding:10px 15px;border-radius:999px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--muted)}.check{display:flex;gap:8px;align-items:center;background:#0b1220;padding:9px;border:1px solid var(--line);border-radius:11px}.check input{width:auto}
</style></head><body>
<div id="toast" class="toast hide"></div>
<div id="login" class="login"><div class="loginbox card"><div class="logo">🧾</div><h1 class="center">بيعتي</h1><p class="center muted">نظام مبيعات بسيط وسريع</p><div id="setup"><h3>إنشاء حساب المالك</h3><label>اسم المالك</label><input id="ownerName" placeholder="اسمك"><label>الرقم السري</label><input id="ownerPin" type="password" inputmode="numeric"><button class="btn primary" style="width:100%;margin-top:12px" onclick="createOwner()">إنشاء الحساب</button></div><div id="signin" class="hide"><h3>تسجيل الدخول</h3><label>اسم المستخدم</label><input id="userName"><label>الرقم السري</label><input id="userPin" type="password" inputmode="numeric"><button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">دخول</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="resetAll()">إعادة البداية</button></div></div></div>
<div id="app" class="hide"><header class="top"><div class="wrap topin"><div><div class="brand">بيعتي</div><div id="who" class="muted"></div></div><button class="btn danger" onclick="logout()">خروج</button></div></header><div class="wrap"><nav id="tabs" class="tabs"></nav><main id="page"></main></div></div>
<div id="modal" class="modal hide" onclick="if(event.target.id==='modal')closeModal()"><div id="modalBox"></div></div>
<script>
const KEY='bayati_v1',PERM={sell:1,cancelSale:0,editSale:0,viewProducts:1,viewPrices:1,addProduct:0,editProduct:0,deleteProduct:0,viewSales:0,viewReports:0,inventory:0,customers:0};let db=load(),me=null,tab='dashboard',cart=[];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return{owner:null,employees:[],products:[{id:1,name:'تيشيرت',price:50,stock:20,low:5,cat:'ملابس'},{id:2,name:'بنطلون',price:100,stock:12,low:3,cat:'ملابس'},{id:3,name:'حذاء',price:150,stock:8,low:2,cat:'أحذية'}],sales:[],customers:[],logs:[]}}
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>Date.now()+Math.floor(Math.random()*999),money=x=>Number(x||0).toLocaleString('ar-SA')+' ر.س',today=()=>new Date().toLocaleDateString('en-CA');function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[a]))}function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2000)}function log(a){db.logs.unshift({a,u:me?.name||'النظام',t:new Date().toLocaleString('ar-SA')});db.logs=db.logs.slice(0,300);save()}
function boot(){if(db.owner){$('setup').classList.add('hide');$('signin').classList.remove('hide')}else{$('setup').classList.remove('hide');$('signin').classList.add('hide')}}function createOwner(){let n=$('ownerName').value.trim(),p=$('ownerPin').value.trim();if(!n||p.length<4)return toast('اكتب الاسم وPIN من 4 أرقام على الأقل');db.owner={name:n,pin:p};save();boot();toast('تم إنشاء حساب المالك')}function can(k){return me?.role==='owner'||!!me?.perms?.[k]}
function login(){let n=$('userName').value.trim(),p=$('userPin').value.trim();if(db.owner&&n===db.owner.name&&p===db.owner.pin){me={role:'owner',id:1,name:n,perms:Object.fromEntries(Object.keys(PERM).map(k=>[k,1]))};start();return}let e=db.employees.find(x=>x.name===n&&x.pin===p);if(e){me={role:'employee',id:e.id,name:e.name,perms:e.perms||PERM};e.status='online';save();start();return}toast('بيانات الدخول غير صحيحة')}
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=(me.role==='owner'?'👑 المالك: ':'🧑‍💼 الموظف: ')+me.name;drawTabs();render()}function logout(){if(me?.role==='employee'){let e=db.employees.find(x=>x.id===me.id);if(e)e.status='offline';save()}me=null;cart=[];$('app').classList.add('hide');$('login').classList.remove('hide');boot()}function go(x){tab=x;drawTabs();render()}
function drawTabs(){let a=me.role==='owner'?[['dashboard','الرئيسية'],['sales','🛒 البيع'],['products','📦 المنتجات'],['employees','👥 الموظفون'],['customers','العملاء'],['reports','📊 التقارير'],['logs','السجل'],['settings','الإعدادات']]:[['sales','🛒 البيع'],['products','📦 المنتجات'],['mySales','مبيعاتي'],['customers','العملاء'],['profile','حسابي']];$('tabs').innerHTML=a.filter(x=>x[0]!=='sales'||can('sell')).map(x=>`<button class="${tab===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function render(){let f={dashboard,sales,products,employees,customers,reports,logs,settings,mySales,profile}[tab]||dashboard;$('page').innerHTML=f()}
function dashboard(){let s=db.sales.filter(x=>x.date===today()),sum=s.reduce((a,x)=>a+x.total,0),low=db.products.filter(x=>x.stock<=x.low);return `<h1>لوحة التحكم</h1><p class="muted">كل المهم أمامك.</p><div class="grid g4"><div class="stat"><span>مبيعات اليوم</span><div class="big">${money(sum)}</div></div><div class="stat"><span>الفواتير</span><div class="big">${s.length}</div></div><div class="stat"><span>المنتجات</span><div class="big">${db.products.length}</div></div><div class="stat"><span>مخزون منخفض</span><div class="big">${low.length}</div></div></div><div class="card"><h2>اختصارات</h2><div class="actions"><button class="btn primary" onclick="go('sales')">بيع جديد</button><button class="btn ghost" onclick="go('products')">المنتجات</button>${me.role==='owner'?'<button class="btn ghost" onclick="go(\'employees\')">الموظفون</button><button class="btn ghost" onclick="go(\'reports\')">التقارير</button>':''}</div></div><div class="card"><h2>الأكثر مبيعًا</h2>${best().map(x=>`<div class="item"><span>${esc(x.name)}</span><b>${x.qty} قطعة</b></div>`).join('')||'<div class="empty">لا توجد مبيعات بعد</div>'}</div>${low.length?`<div class="card"><h2>⚠️ مخزون منخفض</h2>${low.map(p=>`<div class="item"><span>${esc(p.name)}</span><b>${p.stock} متبقي</b></div>`).join('')}</div>`:''}`}
function best(){let m={};db.sales.forEach(s=>s.items.forEach(i=>m[i.pid]=(m[i.pid]||0)+i.qty));return Object.entries(m).map(([k,q])=>({name:db.products.find(p=>p.id==k)?.name||'محذوف',qty:q})).sort((a,b)=>b.qty-a.qty).slice(0,5)}
function sales(){let q=window.sq||'',ps=db.products.filter(p=>p.name.includes(q)||p.cat.includes(q));return `<h1>🛒 البيع</h1><p class="muted">ابحث، أضف للسلة، ثم أكمل البيع.</p><div class="card"><input value="${esc(q)}" placeholder="🔎 ابحث عن منتج..." oninput="window.sq=this.value;render()"></div><div class="grid g2"><div>${ps.map(p=>`<div class="item"><div><div class="name">${esc(p.name)}</div><div class="price">${can('viewPrices')?money(p.price):'السعر مخفي'}</div><div class="small">المخزون: ${p.stock}</div></div><button class="btn primary" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>إضافة</button></div>`).join('')||'<div class="empty">لا يوجد منتج</div>'}</div><div class="card"><div class="row"><h2>السلة</h2><button class="btn ghost" onclick="cart=[];render()">تفريغ</button></div>${cart.map((x,i)=>`<div class="item"><div><b>${esc(x.name)}</b><div class="price">${money(x.price*x.qty)}</div></div><div class="actions"><button class="btn ghost" onclick="chg(${i},-1)">−</button><b style="padding:9px">${x.qty}</b><button class="btn ghost" onclick="chg(${i},1)">+</button></div></div>`).join('')||'<div class="empty">السلة فارغة</div>'}<div class="row"><b>الإجمالي</b><b class="big">${money(totalCart())}</b></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="checkout()">إتمام البيع وإصدار الفاتورة</button></div></div>${me.role==='owner'?`<div class="card"><h2>آخر الفواتير</h2>${db.sales.slice(0,6).map(sale).join('')||'<div class="empty">لا توجد فواتير</div>'}</div>`:''}`}
function add(pid){let p=db.products.find(x=>x.id===pid),x=cart.find(x=>x.pid===pid);if(!p||p.stock<1)return;if(x){if(x.qty<p.stock)x.qty++}else cart.push({pid,name:p.name,price:p.price,qty:1});render()}function chg(i,d){let x=cart[i],p=db.products.find(p=>p.id===x.pid);x.qty=Math.max(0,Math.min(p.stock,x.qty+d));if(!x.qty)cart.splice(i,1);render()}function totalCart(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function checkout(){if(!cart.length)return toast('السلة فارغة');cart.forEach(x=>db.products.find(p=>p.id===x.pid).stock-=x.qty);let s={id:uid(),date:today(),time:new Date().toLocaleString('ar-SA'),user:me.name,uid:me.id,total:totalCart(),items:cart.map(x=>({...x}))};db.sales.unshift(s);cart=[];log('بيع فاتورة #'+s.id);save();render();invoice(s)}function sale(s){return `<div class="item"><div><b>#${s.id}</b><div class="small">${esc(s.user)} • ${esc(s.time)}</div></div><b class="price">${money(s.total)}</b></div>`}function invoice(s){$('modal').classList.remove('hide');$('modalBox').innerHTML=`<h2>🧾 الفاتورة #${s.id}</h2><p class="muted">${esc(s.time)} • ${esc(s.user)}</p><table><tr><th>المنتج</th><th>الكمية</th><th>الإجمالي</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}</table><div class="row" style="margin-top:15px"><b>الإجمالي</b><b class="big">${money(s.total)}</b></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="print()">🖨️ طباعة</button><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`}function closeModal(){$('modal').classList.add('hide')}
function products(){let q=window.pq||'';return `<div class="row"><div><h1>📦 المنتجات</h1><p class="muted">الاسم والسعر والمخزون.</p></div>${me.role==='owner'||can('addProduct')?'<button class="btn primary" onclick="productForm()">+ منتج</button>':''}</div><div class="card"><input value="${esc(q)}" placeholder="🔎 بحث..." oninput="window.pq=this.value;render()"></div>${db.products.filter(p=>p.name.includes(q)||p.cat.includes(q)).map(p=>`<div class="item"><div><div class="name">${esc(p.name)}</div><div class="price">${can('viewPrices')?money(p.price):'السعر مخفي'}</div><div class="small">${esc(p.cat)} • مخزون ${p.stock} • تنبيه ${p.low}</div></div><div class="actions">${me.role==='owner'||can('editProduct')?`<button class="btn ghost" onclick="productForm(${p.id})">تعديل</button>`:''}${me.role==='owner'||can('deleteProduct')?`<button class="btn danger" onclick="delProduct(${p.id})">حذف</button>`:''}</div></div>`).join('')||'<div class="empty">لا توجد منتجات</div>'}`}
function productForm(pid){let p=db.products.find(x=>x.id===pid)||{name:'',price:0,stock:0,low:2,cat:'عام'};$('modal').classList.remove('hide');$('modalBox').innerHTML=`<h2>${pid?'تعديل':'إضافة'} منتج</h2><div class="grid g2"><div><label>الاسم</label><input id="pn" value="${esc(p.name)}"></div><div><label>السعر</label><input id="pp" type="number" value="${p.price}"></div><div><label>المخزون</label><input id="ps" type="number" value="${p.stock}"></div><div><label>حد التنبيه</label><input id="pl" type="number" value="${p.low}"></div><div><label>التصنيف</label><input id="pc" value="${esc(p.cat)}"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveProduct(${pid||0})">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`}function saveProduct(pid){let n=$('pn').value.trim(),pr=+$('pp').value,st=+$('ps').value,lo=+$('pl').value,c=$('pc').value.trim()||'عام';if(!n||pr<0||st<0)return toast('تحقق من البيانات');if(pid)Object.assign(db.products.find(p=>p.id===pid),{name:n,price:pr,stock:st,low:lo,cat:c});else db.products.push({id:uid(),name:n,price:pr,stock:st,low:lo,cat:c});log((pid?'تعديل':'إضافة')+' منتج '+n);save();closeModal();render()}function delProduct(pid){if(!confirm('حذف المنتج؟'))return;db.products=db.products.filter(p=>p.id!==pid);log('حذف منتج');save();render()}
function employees(){return `<div class="row"><div><h1>👥 الموظفون</h1><p class="muted">صلاحيات منفصلة لكل موظف.</p></div><button class="btn primary" onclick="empForm()">+ موظف</button></div>${db.employees.map(e=>`<div class="item"><div><b>${esc(e.name)}</b><div class="small"><span class="badge ${e.status==='online'?'on':''}">${e.status==='online'?'متصل':e.status==='break'?'استراحة':'غير متصل'}</span></div></div><div class="actions"><button class="btn ghost" onclick="empForm(${e.id})">الصلاحيات</button><button class="btn danger" onclick="delEmp(${e.id})">حذف</button></div></div>`).join('')||'<div class="empty">لم تضف موظفين</div>'}`}
function empForm(eid){let e=db.employees.find(x=>x.id===eid)||{name:'',pin:'',perms:{...PERM}},L={sell:'البيع',cancelSale:'إلغاء البيع',editSale:'تعديل البيع',viewProducts:'مشاهدة المنتجات',viewPrices:'مشاهدة الأسعار',addProduct:'إضافة منتج',editProduct:'تعديل منتج',deleteProduct:'حذف منتج',viewSales:'المبيعات',viewReports:'التقارير',inventory:'المخزون',customers:'العملاء'};$('modal').classList.remove('hide');$('modalBox').innerHTML=`<h2>${eid?'تعديل':'إضافة'} موظف</h2><div class="grid g2"><div><label>الاسم</label><input id="en" value="${esc(e.name)}"></div><div><label>PIN</label><input id="ep" value="${esc(e.pin)}" inputmode="numeric"></div></div><h3 style="margin-top:15px">الصلاحيات</h3><div class="grid g2">${Object.entries(L).map(([k,v])=>`<label class="check"><input id="ck_${k}" type="checkbox" ${e.perms?.[k]?'checked':''}>${v}</label>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveEmp(${eid||0})">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`}function saveEmp(eid){let n=$('en').value.trim(),p=$('ep').value.trim();if(!n||p.length<4)return toast('الاسم وPIN مطلوبان');let perms={};Object.keys(PERM).forEach(k=>perms[k]=$('ck_'+k).checked);if(eid)Object.assign(db.employees.find(e=>e.id===eid),{name:n,pin:p,perms});else db.employees.push({id:uid(),name:n,pin:p,perms,status:'offline'});log('حفظ موظف '+n);save();closeModal();render()}function delEmp(i){if(!confirm('حذف الموظف؟'))return;db.employees=db.employees.filter(e=>e.id!==i);save();render()}
function customers(){return `<div class="row"><h1>👥 العملاء</h1><button class="btn primary" onclick="custForm()">+ عميل</button></div>${db.customers.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="small">${esc(c.phone||'بدون جوال')}</div></div><button class="btn danger" onclick="delCust(${c.id})">حذف</button></div>`).join('')||'<div class="empty">لا يوجد عملاء</div>'}function custForm(){$('modal').classList.remove('hide');$('modalBox').innerHTML=`<h2>إضافة عميل</h2><label>الاسم</label><input id="cn"><label>الجوال</label><input id="cp" inputmode="tel"><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveCust()">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`}function saveCust(){let n=$('cn').value.trim();if(!n)return toast('اكتب اسم العميل');db.customers.push({id:uid(),name:n,phone:$('cp').value.trim()});save();closeModal();render()}function delCust(i){db.customers=db.customers.filter(x=>x.id!==i);save();render()}
function reports(){let total=db.sales.reduce((a,s)=>a+s.total,0),day=db.sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.total,0),qty=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);return `<h1>📊 التقارير</h1><div class="grid g3"><div class="stat"><span>إجمالي المبيعات</span><div class="big">${money(total)}</div></div><div class="stat"><span>اليوم</span><div class="big">${money(day)}</div></div><div class="stat"><span>القطع</span><div class="big">${qty}</div></div></div><div class="card"><h2>الأكثر مبيعًا</h2>${best().map((x,i)=>`<div class="item"><span>${i+1}. ${esc(x.name)}</span><b>${x.qty}</b></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div><div class="card"><h2>الفواتير</h2>${db.sales.slice(0,30).map(sale).join('')||'<div class="empty">لا توجد فواتير</div>'}</div>`}
function mySales(){return `<h1>🧾 مبيعاتي</h1><div class="card">${db.sales.filter(s=>s.uid===me.id).map(sale).join('')||'<div class="empty">لا توجد مبيعات</div>'}</div>`}function logs(){return `<h1>📝 السجل</h1><div class="card">${db.logs.map(x=>`<div class="item"><div><b>${esc(x.a)}</b><div class="small">${esc(x.u)}</div></div><span class="small">${esc(x.t)}</span></div>`).join('')||'<div class="empty">السجل فارغ</div>'}</div>`}function profile(){let e=db.employees.find(x=>x.id===me.id);return `<h1>⚙️ حسابي</h1><div class="card"><h2>${esc(me.name)}</h2><p class="muted">الحالة: ${e?.status==='online'?'متصل':e?.status==='break'?'استراحة':'غير متصل'}</p><div class="actions"><button class="btn primary" onclick="status('online')">متصل</button><button class="btn warn" onclick="status('break')">استراحة</button><button class="btn ghost" onclick="status('offline')">غير متصل</button></div></div>`}function status(s){let e=db.employees.find(x=>x.id===me.id);if(e)e.status=s;save();render()}
function settings(){return `<h1>⚙️ الإعدادات</h1><div class="card"><h2>نسخة احتياطية</h2><p class="muted">هذه النسخة تحفظ البيانات في المتصفح. سنربط Supabase لاحقًا للمزامنة بين الأجهزة.</p><button class="btn primary" onclick="backup()">تصدير البيانات</button><button class="btn danger" style="margin-right:7px" onclick="resetAll()">مسح البيانات</button></div><div class="card"><h2>المزايا الموجودة</h2><p class="muted">مالك، موظفون، صلاحيات، منتجات، مخزون، بيع، سلة، فواتير، تقارير، عملاء، سجل نشاط، بحث، وتنبيه مخزون منخفض.</p></div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='bayati-backup.json';a.click()}function resetAll(){if(!confirm('سيتم حذف البيانات المحلية. متأكد؟'))return;localStorage.removeItem(KEY);location.reload()}boot();
</script></body></html>
